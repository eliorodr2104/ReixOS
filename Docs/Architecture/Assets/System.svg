<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
<title id="title">ReixOS architecture</title>
<desc id="desc">EL0 applications and services use the Reix SDK to call the EL1 kernel. RAM contains the kernel image and initrd, stacks, kernel allocations, user pages and shared or DMA buffers. The userland storage services access a persistent RxFS disk through virtio. Arrows show syscall entry, physical memory management, privileged hardware access and the block-device path. Memory groups are schematic and not to scale.</desc>
<defs>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#242522"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#BE442D"/></marker>
</defs>
